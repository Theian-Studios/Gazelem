<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math 290 Practice Quizzes</title>
<style>
  :root {
    --blue: #1d4ed8;
    --blue-dark: #1e3a8a;
    --blue-light: #eff6ff;
    --border: #dbeafe;
    --text: #1e293b;
    --muted: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: #fff;
  }
  header {
    background: linear-gradient(135deg, var(--blue-dark), var(--blue));
    color: #fff;
    padding: 48px 16px 40px;
    text-align: center;
  }
  header h1 { margin: 0 0 8px; font-size: 2.2rem; }
  header p { margin: 0; opacity: 0.9; }
  main { max-width: 1000px; margin: 0 auto; padding: 32px 16px 48px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    background: #fff;
    box-shadow: 0 1px 3px rgba(29, 78, 216, 0.08);
  }
  .card h2 {
    margin: 0 0 16px;
    font-size: 1.25rem;
    color: var(--blue-dark);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--blue);
    color: #fff;
    font-weight: 700;
  }
  .card h2 small {
    margin-left: auto;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--blue);
    background: var(--blue-light);
    padding: 3px 8px;
    border-radius: 999px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--blue-light);
    margin-bottom: 8px;
  }
  .row span { font-weight: 600; }
  .btns { display: flex; gap: 6px; }
  .btn {
    font: inherit;
    font-size: 0.85rem;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--blue);
    cursor: pointer;
    text-decoration: none;
  }
  .btn.view { background: var(--blue); color: #fff; }
  .btn.view:hover { background: var(--blue-dark); }
  .btn.dl { background: #fff; color: var(--blue); }
  .btn.dl:hover { background: var(--blue-light); }

  /* PDF viewer */
  .viewer {
    position: fixed; inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    background: #f1f5f9;
    opacity: 0;
    visibility: hidden;
    transition: opacity .18s ease, visibility .18s;
  }
  .viewer.open { opacity: 1; visibility: visible; }
  .viewer-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    background: #fff;
    border-bottom: 1px solid var(--border);
  }
  .viewer-title { flex: 1; min-width: 0; }
  .viewer-title strong {
    display: block;
    color: var(--blue-dark);
    font-size: 1rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .viewer-title span { font-size: 0.8rem; color: var(--muted); }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 12px;
    border-radius: 8px;
    border: 0;
    background: transparent;
    color: var(--blue);
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--blue-light); }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.close { color: var(--muted); padding: 0 8px; }
  .viewer-page {
    flex: 1;
    display: flex;
    padding: 20px 16px 0;
    min-height: 0;
  }
  .viewer iframe {
    flex: 1;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    border: 0;
    border-radius: 10px 10px 0 0;
    background: #fff;
    box-shadow: 0 4px 24px rgba(30, 58, 138, 0.12);
  }
  .btn:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  body.viewing { overflow: hidden; }

  footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 0 16px 32px; }
  @media (max-width: 600px) {
    .icon-btn .label { display: none; }
    .viewer-page { padding: 0; }
    .viewer iframe { border-radius: 0; box-shadow: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Math 290 Practice Quizzes</h1>
  <p>Practice Quiz 2 &middot; Extra practice, Sections 6&ndash;11</p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>View a PDF in the browser or download it to keep.</footer>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-name">
  <div class="viewer-bar">
    <div class="viewer-title">
      <strong id="viewer-name"></strong>
      <span>Math 290 &middot; Practice Quiz 2</span>
    </div>
    <a class="icon-btn" id="viewer-dl" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>
      <span class="label">Download</span>
    </a>
    <button class="icon-btn close" id="viewer-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="viewer-page">
    <iframe id="viewer-frame" title="PDF"></iframe>
  </div>
</div>

<script>
  const versions = [
    { name: "Original", base: "Math290_PracticeQuiz2_ORIGINAL_from_Canvas", note: "From Canvas" },
    ...["A", "B", "C", "D", "E", "F", "G"].map(v => ({ badge: v, name: `Version ${v}`, base: `Math290_PracticeQuiz2_Version${v}` }))
  ];
  const grid = document.getElementById("grid");

  function row(label, file, title) {
    return `
      <div class="row">
        <span>${label}</span>
        <div class="btns">
          <button class="btn view" data-file="${file}" data-title="${title}">View</button>
          <a class="btn dl" href="${file}" download>Download</a>
        </div>
      </div>`;
  }

  grid.innerHTML = versions.map(v => `
      <div class="card">
        <h2>${v.badge ? `<span class="badge">${v.badge}</span> ` : ""}${v.name}${v.note ? `<small>${v.note}</small>` : ""}</h2>
        ${row("Quiz", v.base + ".pdf", `${v.name} — Quiz`)}
        ${row("Solutions", v.base + "_Solutions.pdf", `${v.name} — Solutions`)}
      </div>`).join("");

  const viewer = document.getElementById("viewer");
  const frame = document.getElementById("viewer-frame");

  grid.addEventListener("click", e => {
    const btn = e.target.closest(".btn.view");
    if (!btn) return;
    // Phones can't show a PDF inside the page well, so open it directly.
    if (window.matchMedia("(max-width: 600px)").matches) {
      window.location.href = btn.dataset.file;
      return;
    }
    // Hide the browser's own PDF toolbar; the bar above already has Download.
    frame.src = btn.dataset.file + "#toolbar=0&navpanes=0&view=FitH";
    document.getElementById("viewer-name").textContent = btn.dataset.title;
    document.getElementById("viewer-dl").href = btn.dataset.file;
    viewer.classList.add("open");
    document.body.classList.add("viewing");
    document.getElementById("viewer-close").focus();
  });

  function closeViewer() {
    if (!viewer.classList.contains("open")) return;
    viewer.classList.remove("open");
    document.body.classList.remove("viewing");
    frame.src = "about:blank";
  }
  document.getElementById("viewer-close").addEventListener("click", closeViewer);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeViewer(); });
</script>
</body>
</html>
