<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math 290 Practice Quizzes</title>
<style>
  :root {
    --blue: #1d4ed8;
    --blue-dark: #1e3a8a;
    --blue-light: #eff6ff;
    --border: #dbeafe;
    --text: #1e293b;
    --muted: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: #fff;
  }
  header {
    background: linear-gradient(135deg, var(--blue-dark), var(--blue));
    color: #fff;
    padding: 48px 16px 40px;
    text-align: center;
  }
  header h1 { margin: 0 0 8px; font-size: 2.2rem; }
  header p { margin: 0; opacity: 0.9; }
  main { max-width: 1000px; margin: 0 auto; padding: 32px 16px 48px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    background: #fff;
    box-shadow: 0 1px 3px rgba(29, 78, 216, 0.08);
  }
  .card h2 {
    margin: 0 0 16px;
    font-size: 1.25rem;
    color: var(--blue-dark);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--blue);
    color: #fff;
    font-weight: 700;
  }
  .card h2 small {
    margin-left: auto;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--blue);
    background: var(--blue-light);
    padding: 3px 8px;
    border-radius: 999px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--blue-light);
    margin-bottom: 8px;
  }
  .row span { font-weight: 600; }
  .btns { display: flex; gap: 6px; }
  .btn {
    font: inherit;
    font-size: 0.85rem;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--blue);
    cursor: pointer;
    text-decoration: none;
  }
  .btn.view { background: var(--blue); color: #fff; }
  .btn.view:hover { background: var(--blue-dark); }
  .btn.dl { background: #fff; color: var(--blue); }
  .btn.dl:hover { background: var(--blue-light); }

  /* PDF viewer */
  .viewer {
    display: none;
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, 0.6);
    padding: 24px;
    z-index: 10;
  }
  .viewer.open { display: flex; }
  .viewer-box {
    background: #fff;
    border-radius: 12px;
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .viewer-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 16px;
    background: var(--blue);
    color: #fff;
  }
  .viewer-bar strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer-bar .btn { border-color: #fff; }
  .viewer-bar .btn.dl { background: #fff; }
  .viewer-bar .btn.close { background: transparent; color: #fff; }
  .viewer iframe { flex: 1; border: 0; width: 100%; }

  footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 0 16px 32px; }
  @media (max-width: 600px) {
    .viewer { padding: 0; }
    .viewer-box { border-radius: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Math 290 Practice Quizzes</h1>
  <p>Practice Quiz 2 &middot; Extra practice, Sections 6&ndash;11</p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>View a PDF in the browser or download it to keep.</footer>

<div class="viewer" id="viewer">
  <div class="viewer-box">
    <div class="viewer-bar">
      <strong id="viewer-title"></strong>
      <div class="btns">
        <a class="btn dl" id="viewer-dl" download>Download</a>
        <button class="btn close" id="viewer-close">Close ✕</button>
      </div>
    </div>
    <iframe id="viewer-frame" title="PDF viewer"></iframe>
  </div>
</div>

<script>
  const versions = [
    { name: "Original", base: "Math290_PracticeQuiz2_ORIGINAL_from_Canvas", note: "From Canvas" },
    ...["A", "B", "C", "D", "E", "F", "G"].map(v => ({ badge: v, name: `Version ${v}`, base: `Math290_PracticeQuiz2_Version${v}` }))
  ];
  const grid = document.getElementById("grid");

  function row(label, file, title) {
    return `
      <div class="row">
        <span>${label}</span>
        <div class="btns">
          <button class="btn view" data-file="${file}" data-title="${title}">View</button>
          <a class="btn dl" href="${file}" download>Download</a>
        </div>
      </div>`;
  }

  grid.innerHTML = versions.map(v => `
      <div class="card">
        <h2>${v.badge ? `<span class="badge">${v.badge}</span> ` : ""}${v.name}${v.note ? `<small>${v.note}</small>` : ""}</h2>
        ${row("Quiz", v.base + ".pdf", `${v.name} — Quiz`)}
        ${row("Solutions", v.base + "_Solutions.pdf", `${v.name} — Solutions`)}
      </div>`).join("");

  const viewer = document.getElementById("viewer");
  const frame = document.getElementById("viewer-frame");

  grid.addEventListener("click", e => {
    const btn = e.target.closest(".btn.view");
    if (!btn) return;
    frame.src = btn.dataset.file;
    document.getElementById("viewer-title").textContent = btn.dataset.title;
    document.getElementById("viewer-dl").href = btn.dataset.file;
    viewer.classList.add("open");
  });

  function closeViewer() {
    viewer.classList.remove("open");
    frame.src = "about:blank";
  }
  document.getElementById("viewer-close").addEventListener("click", closeViewer);
  viewer.addEventListener("click", e => { if (e.target === viewer) closeViewer(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeViewer(); });
</script>
</body>
</html>
