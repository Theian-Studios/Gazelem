<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gazelem">
  <!-- The wordmark's initial, in the site's two colours: the ink the scripture
       is set in, and the gold everything you can open is drawn in. A letter
       rather than a device, because at sixteen pixels a device is a smudge and
       a G is still a G. -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3346"/>
      <stop offset="1" stop-color="#161c28"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#stone)"/>
  <text x="32" y="45.5" text-anchor="middle"
        font-family="Iowan Old Style, Palatino, Georgia, 'Times New Roman', serif"
        font-size="42" font-weight="600" fill="#c9a75a">G</text>
</svg>
